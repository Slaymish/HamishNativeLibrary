name: Library release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: library-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate and create reviewable release
        run: |
          python3 scripts/check-release.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "HamishNativeLibrary ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
